[package]
name = "spike-audio-processo"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "spike-audio-processo"
path = "src/main.rs"

# Gerador de tom para os testes (toca um seno pelo PlaySound do Windows).
[[bin]]
name = "tom"
path = "src/tom.rs"

[dependencies]
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }
